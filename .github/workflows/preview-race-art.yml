name: Prepare small previews of uploaded creature art
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-race-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Generate previews of numbered uploads
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import io
          names = [582,584,589,590,591,592,593,597,599,600,601,602,603,604,605,607,608]
          dest = Path('assets/race-upload-review')
          dest.mkdir(parents=True, exist_ok=True)
          for name in names:
              src = Path(f'{name}.png')
              if not src.is_file():
                  raise FileNotFoundError(src)
              with Image.open(src) as im:
                  small = ImageOps.contain(im.convert('RGB'),(430,500))
                  small.save(dest/f'{name}.jpg',format='JPEG',quality=55,optimize=True)
                  print(f'{src} -> {dest / f"{name}.jpg"}')
          PY
      - name: Commit review thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/race-upload-review
          if ! git diff --cached --quiet; then
            git commit -m "Create small previews of new creature race artwork"
            git push origin HEAD:main
          fi
