<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0717">
<meta name="description" content="Explore the concept art, character portraits, peoples, creatures and places of The Chronicles of Plu and Selena.">
<title>Concept Art Gallery | The Chronicles of Plu and Selena</title>
<link rel="stylesheet" href="/styles.css">
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b0717;color:#f5eee6;font-family:Georgia,serif}
.art-gallery-page{max-width:1440px;margin:auto;padding:34px clamp(16px,4vw,48px) 70px}
.gallery-topline{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.gallery-back{color:#f1d49b;text-decoration:none}
.art-gallery-page h1{font-size:clamp(32px,6vw,54px);color:#f1d49b;margin:24px 0 8px}
.art-gallery-intro{color:#d6c8d9;line-height:1.65;max-width:760px}
.gallery-controls{margin:28px 0;display:grid;gap:15px}
#art-search{width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid #806786;background:#191126;color:white;border-radius:5px;font-size:16px}
#filters{display:flex;flex-wrap:wrap;gap:9px}
.filter{padding:10px 14px;border:1px solid #806786;background:#1b1228;color:#eadcf0;border-radius:4px;cursor:pointer}
.filter[aria-pressed=true],.filter:hover{background:#49314e;border-color:#e5c48e;color:white}
#count{color:#cbb8d0;font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.art{margin:0;min-width:0;background:#191126;border:1px solid #624b68;border-radius:5px;overflow:hidden}
.art a{display:block;background:#100c19;aspect-ratio:4/5}
.art img{display:block;width:100%;height:100%;object-fit:contain}
.art figcaption{padding:12px 14px;display:grid;gap:5px}
.art figcaption strong{color:#f1d49b;font-size:16px}
.art figcaption small{color:#bdaacc;font-size:12px}
.art[hidden]{display:none}
@media(max-width:520px){#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art-gallery-page{padding:24px 12px 55px}.art figcaption{padding:9px}.art figcaption strong{font-size:14px}}
</style>
</head>
<body>
<main class="art-gallery-page">
<div class="gallery-topline"><a class="gallery-back" href="/">← Back to the Chronicles</a><span>THE CHRONICLES OF PLU AND SELENA</span></div>
<h1>Concept Art Gallery</h1>
<p class="art-gallery-intro">Explore character designs, fantasy peoples, creatures, shared moments, and places from the world of Plu and Selena. Select an illustration to open the full-size artwork.</p>
<div class="gallery-controls">
<input id="art-search" type="search" placeholder="Search the artwork…" aria-label="Search artwork">
<div id="filters" aria-label="Filter artwork">
<button class="filter" type="button" data-filter="all" aria-pressed="true">All artwork</button>
<button class="filter" type="button" data-filter="characters" aria-pressed="false">Characters</button>
<button class="filter" type="button" data-filter="plu" aria-pressed="false">Plu's forms</button>
<button class="filter" type="button" data-filter="races" aria-pressed="false">Races</button>
<button class="filter" type="button" data-filter="creatures" aria-pressed="false">Creatures</button>
<button class="filter" type="button" data-filter="world" aria-pressed="false">World &amp; magic</button>
<button class="filter" type="button" data-filter="moments" aria-pressed="false">Shared moments</button>
</div>
<div id="count" aria-live="polite"></div>
</div>
<div id="grid"></div>
</main>

":"races"},{"name":"Giants","path":"assets/race-scenes/giants.png","category":"races"},{"name":"Ogres","path":"assets/race-scenes/ogres.png","category":"races"},{"name":"Cyclopes","path":"assets/race-scenes/cyclopes.png","category":"races"},{"name":"Succubi","path":"assets/race-scenes/succubi.png","category":"races"},{"name":"Witches & Wiccans","path":"assets/race-scenes/witches-wiccans.png","category":"races"},{"name":"Fairies","path":"assets/race-scenes/fairies.png","category":"races"},{"name":"Werewolves","path":"assets/race-scenes/werewolves.png","category":"races"},{"name":"Harpies","path":"assets/race-scenes/harpies.png","category":"races"},{"name":"Nymphs","path":"assets/race-scenes/nymphs.png","category":"races"},{"name":"Leprechauns","path":"assets/race-scenes/leprechauns.png","category":"races"},{"name":"Dark Slimes","path":"assets/race-scenes/dark-slimes.png","category":"races"},{"name":"Dwarves","path":"assets/race-scenes/dwarves.avif","category":"races"},{"name":"Humans","path":"assets/race-scenes/humans.avif","category":"races"},{"name":"Hybrids","path":"assets/race-scenes/hybrids.avif","category":"races"},{"name":"Monsters","path":"assets/race-scenes/monsters.avif","category":"races"},{"name":"Divine Creation","path":"assets/compact/art-1.webp","category":"world"},{"name":"Bozton","path":"assets/compact/art-2.webp","category":"world"},{"name":"Druidic Magic","path":"assets/compact/art-3.webp","category":"world"},{"name":"Everlangyrs","path":"assets/compact/art-4.webp","category":"world"},{"name":"Residual Essence","path":"assets/compact/art-5.webp","category":"world"},{"name":"Teramek","path":"assets/compact/art-6.webp","category":"world"},{"name":"Crystal Storage","path":"assets/compact/art-7.webp","category":"world"},{"name":"Dark Veil Mountains","path":"assets/compact/art-8.webp","category":"world"},{"name":"New Londanais","path":"assets/compact/art-9.webp","category":"world"},{"name":"Minotaur Sanctuary","path":"assets/compact/art-10.webp","category":"world"},{"name":"Additional World Study 1","path":"assets/compact/art-11.webp","category":"world"},{"name":"Additional World Study 2","path":"assets/compact/art-12.webp","category":"world"},{"name":"Additional World Study 3","path":"assets/compact/art-13.webp","category":"world"},{"name":"Fantasy Atlas","path":"enchanted_realms_fantasy_atlas.png","category":"world"},{"name":"Chimera study 1","path":"assets/chimera/chimera-gallery-1.webp","category":"creatures"},{"name":"Chimera study 2","path":"assets/chimera/chimera-gallery-2.webp","category":"creatures"},{"name":"Chimera study 3","path":"assets/chimera/chimera-gallery-3.webp","category":"creatures"},{"name":"Chimera study 4","path":"assets/chimera/chimera-gallery-4.webp","category":"creatures"}];const grid=document.getElementById('grid'),count=document.getElementById('count'),input=document.getElementById('art-search');let category='all';const labels={moments:'Shared moments',characters:'Characters',races:'Races',creatures:'Creatures',world:'World & magic',plu:"Plu's forms"};art.forEach((item)=>{const figure=document.createElement('figure');figure.className='art';figure.dataset.category=item.category;figure.dataset.name=item.name.toLowerCase();const a=document.createElement('a');a.href='/'+item.path.replace(/^\//,'');a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','View '+item.name+' concept art');const img=document.createElement('img');img.src=a.href;img.alt=item.name+' concept illustration';img.loading='lazy';img.decoding='async';img.onerror=()=>{figure.dataset.missing='true';figure.hidden=true;updateCount()};a.append(img);const caption=document.createElement('figcaption');const name=document.createElement('strong');name.textContent=item.name;const type=document.createElement('small');type.textContent=labels[item.category];caption.append(name,type);figure.append(a,caption);grid.append(figure)});function updateCount(){let visible=0;for(const figure of grid.children){const match=(category==='all'||figure.dataset.category===category)&&figure.dataset.name.includes(input.value.trim().toLowerCase())&&figure.dataset.missing!=='true';figure.hidden=!match;if(match)visible++}count.textContent=visible+' illustration'+(visible===1?'':'s')+' shown'}document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;category=b.dataset.filter;for(const other of document.querySelectorAll('.filter'))other.setAttribute('aria-pressed',String(other===b));updateCount()});input.addEventListener('input',updateCount);updateCount();</script></body></html>
